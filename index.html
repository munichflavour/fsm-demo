<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Eigenbau">
<title>Field Service Management Tool · Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: Kopfzeile mit Reitern, darunter eine Arbeitsfläche pro Rolle. Techniker-Ansicht im Handyrahmen. */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --ink:#1e2a32; --muted:#66737d; --line:#e3e7eb;
  --accent:#0f766e; --accent-ink:#ffffff; --accent-soft:#d9f0ec;
  --ok:#237a52; --ok-soft:#e0f3ea; --warn:#c23b32; --warn-soft:#fbe6e3; --amber:#8a6200; --amber-soft:#fcf0d2;
  --rad:12px; --rad-s:10px; --shadow:0 1px 2px rgba(20,30,40,.06);
  --font:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font)}
h1,h2,h3{margin:0;text-wrap:balance}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.brand{font-weight:700;letter-spacing:.01em}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:1px solid transparent;background:none;padding:7px 12px;border-radius:8px;color:var(--muted);font-weight:500}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.spacer{flex:1}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--muted)}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 60px;display:flex;flex-direction:column;gap:18px}
.note{background:var(--amber-soft);color:var(--amber);border-radius:8px;padding:8px 12px;font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:13px}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.amber{background:var(--amber-soft);color:var(--amber)} .pill.gray{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:8px 14px;font-weight:600}
.btn.sec{background:none;color:var(--accent);border:1px solid var(--accent)}
.btn.small{padding:5px 10px;font-size:13px}
select,input[type=number],input[type=search]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-height:36px}
input[type=number]{width:84px}
/* Handy */
.phone{width:100%;max-width:420px;margin:0 auto;border:8px solid #1d2730;border-radius:30px;background:var(--bg);padding:14px 12px 20px;display:flex;flex-direction:column;gap:12px}
.phone h2{font-size:18px}
.wo{display:flex;flex-direction:column;gap:6px}
.wo-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.wo-t{font-weight:600}
.book{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:10px;margin-top:4px}
.msg{font-size:13px;padding:6px 10px;border-radius:8px}
.msg.err{background:var(--warn-soft);color:var(--warn)} .msg.ok{background:var(--ok-soft);color:var(--ok)}
.entry{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.entry:first-child{border-top:0}

.dstrips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.dstrip{display:flex;flex-direction:column;align-items:center;gap:1px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 2px;font-size:12px}
.dstrip b{font-size:16px;line-height:1.2}.dstrip .g{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.dstrip.cur{outline:2px solid var(--accent)}
.dstrip.full{background:var(--ok-soft);color:var(--ok)} .dstrip.part{background:var(--amber-soft);color:var(--amber)} .dstrip.none{background:var(--warn-soft);color:var(--warn)} .dstrip.over{background:var(--amber-soft);color:var(--amber)}
.dstrip.fabs{background:color-mix(in srgb,hsl(280 45% 55%) 20%,transparent);color:var(--ink)}
.dstrip.abs,.dstrip.fut{color:var(--muted);background:var(--bg)} .dstrip[disabled]{cursor:default;opacity:.55}
.prog{display:flex;flex-direction:column;gap:8px}.prog.full{border-color:var(--ok)}.prog.part{border-color:var(--amber)}
.meter{height:10px;border-radius:5px;background:var(--line);overflow:hidden}.meter i{display:block;height:100%;background:var(--amber)}
.prog.full .meter i{background:var(--ok)}

.wolink{background:none;border:0;padding:0;text-align:left;width:100%;color:inherit}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0}.kv dt{color:var(--muted);font-size:13px}.kv dd{margin:0}
textarea,input[type=text]{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;color:inherit}
canvas#sig{width:100%;height:auto;aspect-ratio:560/200;border:1px dashed var(--muted);border-radius:8px;background:#fff;touch-action:none}
.paper{background:#fff;color:#111;border:1px solid #cfcfcf;border-radius:6px;padding:14px;font-size:14px}
.paper table{table-layout:fixed}.paper td{overflow-wrap:anywhere;padding:3px 10px 3px 0;border-top:1px solid #e6e6e6}.paper td:first-child{color:#555;width:42%}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.stat{display:flex;flex-direction:column;gap:2px;padding:10px 14px}.stat b{font-size:26px;font-variant-numeric:tabular-nums}.stat.bad{border-color:var(--warn)}.stat.bad b{color:var(--warn)}
.proj{display:flex;flex-direction:column;gap:12px}
.wrow{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:minmax(200px,1.1fr) minmax(240px,1.2fr) minmax(260px,1.5fr);gap:12px 18px}
.wrow.ro{background:var(--bg)}.wrow.closed{opacity:.65}
.wr-h{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
@media (max-width:860px){.wrow{grid-template-columns:1fr}}
.cands{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.cand{display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;min-width:150px;text-align:left}
.cand:hover{border-color:var(--accent)}.cand .pos{color:var(--ok);font-size:13px}.cand .neg{color:var(--warn);font-size:13px}
.newwo{display:flex;flex-direction:column;gap:6px;border:1px dashed var(--accent);border-radius:10px;padding:10px;max-width:460px}

table.cal{table-layout:fixed;min-width:760px}.cal th{font-size:13px;color:var(--muted);font-weight:600;padding:4px}
.cal td{padding:3px;border-top:1px solid var(--line)}.cal th.kw{width:54px;font-size:12px}
.calcell{width:100%;min-height:104px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:6px;display:flex;flex-direction:column;gap:4px;align-items:stretch;text-align:left}
.calcell.today{border-color:var(--accent)}.calcell.sel{outline:2px solid var(--accent)}
.cal-top{display:flex;justify-content:space-between;align-items:center}
.cchip{display:block;font-size:11.5px;line-height:1.3;padding:2px 6px;border-radius:5px;background:hsl(var(--h) 55% 50% / .22);border-left:3px solid hsl(var(--h) 60% 45%);font-variant-numeric:tabular-nums}
.cchip.other{background:var(--bg);border-left-color:hsl(var(--h) 20% 55%);color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;background:hsl(var(--h) var(--s,60%) 45%);margin-right:6px}

.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px;font-weight:600;color:var(--muted)}.seg button.on{background:var(--accent);color:var(--accent-ink)}
.tcgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.tcgrid .g2{text-align:center;font-size:12px;color:var(--muted)}
.dstrip.tc{padding:6px 2px;min-height:48px}.dstrip.tod{box-shadow:inset 0 0 0 1px var(--accent)}

.linkbtn{background:none;border:0;padding:0;color:inherit;text-align:left}
.sapbox{background:var(--accent-soft);border-radius:8px;padding:8px 10px}
table.heat{border-collapse:separate;border-spacing:3px}.heat th.hh{font-size:11px;color:var(--muted);font-weight:500;text-align:center;padding:0 0 2px;min-width:26px}
.hc{height:28px;min-width:26px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:12px;font-variant-numeric:tabular-nums}
.hc.h0{background:var(--bg);border:1px solid var(--line)}.hc.h1{background:color-mix(in srgb,var(--accent) 20%,transparent)}.hc.h2{background:color-mix(in srgb,var(--accent) 45%,transparent)}.hc.h3{background:color-mix(in srgb,var(--accent) 75%,transparent);color:var(--accent-ink)}
.hc.hx{background:var(--warn);color:#fff;font-weight:700}.hc.abs{background:repeating-linear-gradient(135deg,var(--bg),var(--bg) 4px,var(--line) 4px,var(--line) 5px)}
.pvt td,.pvt th{vertical-align:middle}tr.clk{cursor:pointer}tr.clk:hover{background:var(--accent-soft)}tr.clk.sel{background:var(--accent-soft)}
.pvt td{border-top:1px solid var(--line)}

.ppg{display:grid;grid-template-columns:170px 1fr;gap:8px;align-items:center;margin:3px 0}.ppt{position:relative;height:16px;background:var(--bg);border:1px solid var(--line);border-radius:4px}tr.sel td{background:var(--accent-soft)}
.tdk{display:flex;flex-direction:column;gap:12px}.tdk>.c1,.tdk>.c2{display:flex;flex-direction:column;gap:12px;min-width:0}
@media (min-width:1000px){.phone.tw{max-width:1180px!important}.tdk{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px 20px;align-items:start}.tdk.wide{grid-template-columns:minmax(0,5fr) minmax(0,4fr)}.tdk>.c1{grid-column:1}.tdk>.c2{grid-column:2;grid-row:1 / span 4}.tw #cards{display:grid!important;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px!important}.tw .pcell{min-height:76px}.tw h2{font-size:22px}}
.phone{border:0!important;border-radius:0!important;background:none!important;padding:0!important;max-width:640px!important}
.tile{display:flex;flex-direction:column;gap:8px}.tile ul{margin:0;padding-left:18px;flex:1}.tile .btn{align-self:flex-start}
.myday{display:flex;flex-direction:column;gap:10px}.monthbox{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.prog{display:flex;flex-direction:column;gap:8px}
.top-in .ghost{white-space:nowrap}

.meter3{display:flex;height:12px;border-radius:6px;background:var(--line);overflow:hidden}.meter3 .p{background:var(--accent)}.meter3 .n{background:hsl(280 45% 55%)}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap}.dotp,.dotn{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}.dotp{background:var(--accent)}.dotn{background:hsl(280 45% 55%)}
.sec{display:flex;align-items:center;gap:6px;margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}.sec .muted{margin-left:auto}.sec:first-of-type{margin-top:6px}
.secempty{padding:4px 0}
.nphcard{border-color:hsl(280 45% 55%);display:flex;flex-direction:column;gap:10px}.npill{background:color-mix(in srgb,hsl(280 45% 55%) 20%,transparent);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips .tog{padding:7px 14px;font-size:14px}
.chips .tog.on{background:color-mix(in srgb,hsl(280 45% 55%) 22%,transparent);border-color:hsl(280 45% 55%);color:var(--ink)}

.meter3 .a{background:repeating-linear-gradient(135deg,#8aa0b3,#8aa0b3 4px,#b8c6d3 4px,#b8c6d3 8px)}.dota{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:repeating-linear-gradient(135deg,#8aa0b3,#8aa0b3 3px,#b8c6d3 3px,#b8c6d3 6px)}
.stack{display:flex;height:16px;border-radius:4px;overflow:hidden;background:var(--bg);border:1px solid var(--line)}.stack i{display:block;height:100%}

.homark{display:inline-block;font-size:10px;font-weight:700;line-height:1;padding:2px 4px;border-radius:4px;background:var(--accent);color:var(--accent-ink);margin-top:2px}
.homark.pend{background:var(--amber-soft);color:var(--amber);border:1px dashed var(--amber)}
.hocard{display:flex;flex-direction:column;gap:10px}

table.ov{border-collapse:separate;border-spacing:0;min-width:100%}
.ov th,.ov td{border-top:1px solid var(--line);padding:6px;vertical-align:top}
.ovn{position:sticky;left:0;background:var(--surface);z-index:1;min-width:140px;text-align:left}
.ovh{min-width:158px;text-align:center;padding:0!important}.ovh button{width:100%;background:none;border:0;padding:6px;color:var(--muted);font-weight:600;font-size:13px}
.ovh.sel button{background:var(--accent-soft);color:var(--accent)}.ovh.tod button{box-shadow:inset 0 -2px 0 var(--accent)}
.ovc.sel{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.ovcell{display:flex;flex-direction:column;gap:3px;align-items:flex-start;min-height:34px}
.oc{display:inline-block;font-size:11.5px;line-height:1.3;padding:2px 6px;border-radius:5px;background:hsl(var(--h,200) var(--s,55%) 50% / .25);border-left:3px solid hsl(var(--h,200) var(--s,60%) 45%);font-variant-numeric:tabular-nums}
.oc.plan{background:transparent;border:1px dashed hsl(var(--h,200) var(--s,40%) 55%);border-left:3px dashed hsl(var(--h,200) var(--s,60%) 45%)}
.oc.absc{background:repeating-linear-gradient(135deg,var(--bg),var(--bg) 4px,var(--line) 4px,var(--line) 5px);border-left:3px solid var(--muted);color:var(--ink)}
.oc.nphc{background:color-mix(in srgb,var(--c) 22%,transparent);border-left:3px solid var(--c)}

.hrow{display:grid;grid-template-columns:130px 1fr 120px;gap:10px;align-items:center;padding:5px 0}.hrow.total{border-bottom:1px solid var(--line);padding-bottom:8px}
@media (max-width:640px){.hrow{grid-template-columns:90px 1fr 90px}}
.hbar{display:flex;height:22px;border-radius:5px;overflow:hidden;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line)}.hbar i{display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;color:#fff;min-width:0;overflow:hidden}
.hbar i span{padding:0 2px;text-shadow:0 0 2px rgba(0,0,0,.35)}
.seg-abs{background:repeating-linear-gradient(135deg,#8aa0b3,#8aa0b3 4px,#b8c6d3 4px,#b8c6d3 8px)}.seg-miss{background:var(--warn);box-shadow:none}
.dot.seg-miss{background:var(--warn)}
.hv{text-align:right;font-variant-numeric:tabular-nums}
.pbar{position:relative;height:18px;border-radius:5px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}.pbar i{display:block;height:100%}.pbar .p100{position:absolute;right:0;top:0;bottom:0;width:2px;background:var(--ink);opacity:.5}
.vchart{display:flex;gap:10px;align-items:flex-end;margin-top:10px;overflow-x:auto;padding-bottom:4px}.vcol{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:46px;flex:1}
.vstack{width:100%;height:190px;display:flex;flex-direction:column-reverse;border-radius:5px 5px 0 0;overflow:hidden;background:transparent}.vstack i{display:block;width:100%}.vl{white-space:nowrap}.vv{font-variant-numeric:tabular-nums}

.oc.wide{display:block;max-width:190px;white-space:normal}.oc small{display:block;font-size:10.5px;opacity:.75}

.pchip{display:inline-flex;align-items:center;gap:6px;cursor:default}.pchip button{border:0;background:none;color:inherit;font-size:15px;line-height:1;padding:0 2px;cursor:pointer}
.teampanel{background:var(--accent-soft);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.chip.site{background:color-mix(in srgb,hsl(var(--h) 55% 50%) 25%,transparent);color:var(--ink);border:1px dashed hsl(var(--h) 45% 45%)}
.cchip.site{border-left-style:dashed;background:transparent;border:1px dashed hsl(var(--h) 45% 50%);border-left:3px dashed hsl(var(--h) 60% 45%)}

table.tmt{border-collapse:separate;border-spacing:0;min-width:640px;width:100%}
.tmt th,.tmt td{padding:8px 6px;border-top:1px solid var(--line);text-align:center;vertical-align:top}
.tmt .tmn{text-align:left;position:sticky;left:0;background:var(--surface);min-width:130px;font-weight:600}
.tmh{min-width:110px}.tms{text-align:left!important;background:var(--bg);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tmc{vertical-align:middle!important}
.tmb{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:var(--surface);padding:0}.tmb:hover{border-color:var(--accent)}
.tmb.on{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 4px var(--surface)}

.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}
.tcard{padding:0;overflow:hidden}.tc-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;background:var(--accent-soft)}.tc-h h2{font-size:18px}
.tc-s{padding:8px 14px 2px;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.tc-r{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 14px;border-top:1px solid var(--line)}
.tc-r:first-of-type{border-top:0}
select.mv{min-height:28px;padding:2px 6px;font-size:12.5px;color:var(--muted);border-style:dashed;width:auto}

.tc-r[draggable=true]{cursor:grab}.tc-r.dragging{opacity:.4}.grip{color:var(--muted);margin-right:2px;font-size:15px}
.tcard.dover{outline:2px dashed var(--accent);outline-offset:-3px;background:var(--accent-soft)}

.tnew{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}.tnew input{min-width:180px;flex:1;max-width:260px}
.tc-e{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
input.tname{font-size:18px;font-weight:700;background:transparent;border:1px solid transparent;border-radius:6px;padding:2px 6px;min-height:0;width:100%}
input.tsite{font-size:12.5px;background:transparent;border:1px solid transparent;border-radius:6px;padding:2px 6px;min-height:0;color:var(--muted);width:100%}
input.tname:hover,input.tsite:hover,input.tname:focus,input.tsite:focus{background:var(--surface);border-color:var(--line)}

.rad{display:inline-flex;align-items:center;gap:6px;font-size:14px}
.pchip small{opacity:.75}

.stat.tb{cursor:pointer;text-align:left;font:inherit;color:inherit}.stat.tb:hover{border-color:var(--accent)}.stat.tb.act{outline:2px solid var(--accent);background:var(--accent-soft)}
.prow{padding:12px 14px}

.mscroll{overflow:auto;max-height:74vh;border:1px solid var(--line);border-radius:8px}
table.mt{border-collapse:separate;border-spacing:0;min-width:100%}
.mt th,.mt td{padding:0;border-bottom:1px solid var(--line)}
.mt thead th{position:sticky;top:0;background:var(--surface);z-index:3;font-size:11px;color:var(--muted);font-weight:600;text-align:center;padding:3px 0}
.mt thead tr:nth-child(2) th{top:22px}
.mkw{border-left:1px solid var(--line)}
.mt .mn{position:sticky;left:0;background:var(--surface);z-index:2;min-width:190px;max-width:190px;text-align:left;padding:3px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt thead .mn{z-index:4}

function initSig(){

    if(UI.rep[id]){const im=new Image();im.onload=()=>x.drawImage(im,0,0);im.src=UI.rep[id]}
    let down=false;
    const pos=e=>{const b=c.getBoundingClientRect();return [(e.clientX-b.left)*c.width/b.width,(e.clientY-b.top)*c.height/b.height]};
    c.addEventListener('pointerdown',e=>{down=true;c.setPointerCapture&&c.setPointerCapture(e.pointerId);const[p,q]=pos(e);x.beginPath();x.moveTo(p,q);x.lineTo(p+.1,q);x.stroke()});
    c.addEventListener('pointermove',e=>{if(!down)return;const[p,q]=pos(e);x.lineTo(p,q);x.stroke()});
    const up=()=>{if(down){down=false;UI.rep[id]=c.toDataURL()}};
    c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);
  });
}

function plBlick(d,users,wokF){

  const homeOf=u=>u.team?'Standort '+u.team+' (arbeitet von dort)':'Zentrale (arbeitet von dort)';
  // Vor Ort ist nur, wer auf einer Workorder mit Zeitraum (kein Remote-Tag, keine Coordination) eingeplant bzw. gebucht ist.
  // Laufende Workorders, Remote-Tage und Coordination werden vom eigenen Standort aus bearbeitet.
  const onSite=(w,u)=>hasPeriod(w)&&w.svc!=='Coordination'&&!isRem(w,d,u.id);
  users.forEach(u=>{
    const a=absOn(u.id,d);if(a&&a.type==='ABSENCE'){abs.push(u);return}
    const ws=new Set();let work=false;
    if(past)S.entries.forEach(e=>{if(e.u===u.id&&e.d===d&&e.w&&e.h>0){const w=wo(e.w);if(onSite(w,u))ws.add(e.w);else work=true}});

    ws.forEach(id=>{const w=wo(id);if(wokF(w)){(g[placeOf(w)]=g[placeOf(w)]||[]).push([u,w])}else other.push(u)});
    if(!ws.size&&work){(g[homeOf(u)]=g[homeOf(u)]||[]).push([u,null])}
    if(hoOn(u.id,d,'approved'))ho.push(u);
    if(!ws.size&&!work)none.push(u)
  });
  const chip=u=>`<span class="plchp" style="${hueS(u)}">${u.name}</span>`;
  const sec=(t,l)=>l.length?`<div style="margin-top:8px"><b>${t}</b> <span class="muted small">(${l.length})</span><div>${l.map(chip).join('')}</div></div>`:'';
  return `<div style="margin-top:8px"><h3>Wer ist wo am ${dname(d)}${d.slice(0,4)}</h3><div class="small muted">${past?'Nach gebuchten Stunden':'Nach Planung'}, passend zu den gewählten Filtern. Vor Ort zählt nur ein Einsatz mit Zeitraum. Laufende Workorders und Remote-Tage arbeitet der Techniker von seinem Standort aus.</div>
    ${Object.entries(g).sort((a,b)=>(/^Standort|^Zentrale/.test(a[0])?1:0)-(/^Standort|^Zentrale/.test(b[0])?1:0)||a[0].localeCompare(b[0],'de')).map(([pl,l])=>`<div style="margin-top:8px"><span class="dot" style="--h:${hueOfPlace(pl)};--s:60%"></span><b>${pl}</b> <span class="muted small">(${l.length})</span><div>${l.map(([u,w])=>`<span class="plchp" style="${hueS(u)}" ${w?`title="${esc(w.title)}"`:''}>${u.name}</span>`).join('')}</div></div>`).join('')}
    ${sec('Anderer Auftrag (belegt)',[...new Set(other)])}${sec('Homeoffice',ho)}${sec('Abwesend',abs)}${sec('Ohne Einsatz',none)}</div>`;
}
function remSet(w,us,f,t,mode){
  if(mode==='site'&&w.remote){w.remote=false;w.rph=(w.rph||[]);assigneesAll(w.id).forEach(u=>w.rph.push({u,f:w.from,t:w.to}))}
  const out=[];
  (w.rph||[]).forEach(q=>{if(!us.includes(q.u)||q.t<f||q.f>t){out.push(q);return}
    if(q.f<f)out.push({u:q.u,f:q.f,t:shiftWd(f,-1)});
    if(q.t>t)out.push({u:q.u,f:shiftWd(t,1),t:q.t})});
  w.rph=out;
  if(mode==='rem')us.forEach(u=>w.rph.push({u,f,t}));

}

    if(k==='name'){const n=v.trim();if(!n||S.res.some(x=>x.id!==r.id&&x.name.toLowerCase()===n.toLowerCase())){UI.msg={kind:'err',wo:'res',text:'Die Bezeichnung darf nicht leer oder doppelt sein.'};render();return}r.name=n}
    else if(k==='off'){r.off=v==='1';if(r.off)rsvAlert(r,S.rsv.filter(x=>x.res===r.id&&x.t>=TODAY),'ausgemustert')}else if(k==='seats')r.seats=parseInt(v,10)>0?parseInt(v,10):null;else r[k]=v.trim();render()},
  rsvF(el){const st=UI.rsvf[el.dataset.w];st[el.dataset.k]=el.value;if(el.dataset.k!=='res'&&st.res&&rsvProblems(st.res,st.f,st.t).length)st.res='';UI.msg=null;render()},
  plOnly(el){PL().only=el.checked;render()},
  ppName(el){const x=ppGet(el.dataset.p).ph[+el.dataset.i],v=el.value.trim();if(v)x.k=v;render()},
  ppOnPh(el){const x=ppGet(el.dataset.p).ph[+el.dataset.i];x.on=el.checked;render()},
  ppF(el){const x=ppGet(el.dataset.p).ph[+el.dataset.i];x.f=el.value;if(x.t&&x.t<x.f)x.t=x.f;render()},
  ppT(el){const x=ppGet(el.dataset.p).ph[+el.dataset.i];x.t=el.value;render()},
  ppSt(el){ppGet(el.dataset.p).ph[+el.dataset.i].st=el.value;render()},
  est(el){wo(el.dataset.w).est=Math.max(0,parseFloat(el.value)||0);render()},
  pvu(el){UI.pvU=el.value;render()},
  dec(el){S.dec=el.value;render()},
  plan(el){const h=Math.max(0,parseFloat(String(el.value).replace(',','.'))||0);const k=el.dataset.u+'|'+el.dataset.w+'|'+el.dataset.d;
    if(h>0) S.plan[k]=h; else delete S.plan[k]; render()}
};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(UI.qsheet){UI.qsheet=false;UI.msg=null;render()}else if(UI.pkPanel){UI.pkPanel=false;render()}else if((UI.app==='pk'||UI.app==='mgmt')&&document.getElementById('plpanel')){plSelect(null);render()}}});
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el&&!el.disabled&&A[el.dataset.a])A[el.dataset.a](el)});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='mgcq'){UI.mg.cq=t.value;applyMgcq();return}if(t.id==='adq'){UI.adq=t.value;const v=t.value.trim().toLowerCase();document.querySelectorAll('.adut tbody tr[data-text]').forEach(r=>{r.style.display=!v||r.dataset.text.includes(v)?'':'none'});return}if(t.id==='mgrq'){UI.mg.rq=t.value;const v=t.value.trim().toLowerCase();document.querySelectorAll('.mgrt tbody tr[data-text]').forEach(r=>{r.style.display=!v||r.dataset.text.includes(v)?'':'none'});return}if(t.id==='qb-s'){UI.qb.s=t.value;qbFilter(t.value)}else if(t.id==='qb-txt')UI.qb.txt=t.value;else if(t.id==='bk-txt'){UI.bk=UI.bk||{};UI.bk.txt=t.value}else if(t.id==='ho-n')UI.hr.note=t.value;else if(t.id==='mgq'){UI.mg.pq=t.value;applyMgq()}else if(t.id==='pp-txt'&&UI.ppf)UI.ppf.txt=t.value;else if(t.id==='pp-blk'&&UI.ppf)UI.ppf.blk=t.value});
document.addEventListener('change',e=>{const el=e.target.closest('[data-c]');if(el&&C[el.dataset.c])C[el.dataset.c](el)});
function movePersonTo(k,id,team){if(!S.teams.includes(team))return;if(k==='pk'){S.pks.find(x=>x.id===id).team=team;const u=userById(id);if(u)u.team=team}else userById(id).team=team;render()}
document.addEventListener('dragstart',e=>{const r=e.target.closest&&e.target.closest('[data-drag]');if(!r)return;e.dataTransfer.setData('text/plain',r.dataset.drag);e.dataTransfer.effectAllowed='move';r.classList.add('dragging')});
document.addEventListener('dragend',()=>{document.querySelectorAll('.dragging,.dover').forEach(x=>x.classList.remove('dragging','dover'))});
document.addEventListener('dragover',e=>{const c=e.target.closest&&e.target.closest('[data-drop]');if(c){e.preventDefault();c.classList.add('dover')}});
document.addEventListener('dragleave',e=>{const c=e.target.closest&&e.target.closest('[data-drop]');if(c&&!c.contains(e.relatedTarget))c.classList.remove('dover')});
document.addEventListener('drop',e=>{const c=e.target.closest&&e.target.closest('[data-drop]');if(!c)return;e.preventDefault();const [k,id]=(e.dataTransfer.getData('text/plain')||'').split('|');if(id)movePersonTo(k,id,c.dataset.drop)});
document.getElementById('reset').addEventListener('click',()=>{init();setApp(APP);render()});
window.addEventListener('hashchange',route);
init();route();
</script>
</body>
</html>
